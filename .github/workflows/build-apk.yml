name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Compile React Production Assets
        run: npm run build

      - name: Sync Web Code into Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Release & Debug APKs
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew assembleRelease --stacktrace
        env:
          CI: false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sathi-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: sathi-mobile-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
